function log(msg){ document.getElementById('log').textContent += msg + '\n'; }

function login(){
  auth.signInWithEmailAndPassword(usernameToEmail(document.getElementById('user').value), document.getElementById('pass').value)
    .then(() => {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('migrateBox').style.display = 'block';
    })
    .catch(e => log('Error de login: ' + e.message));
}

async function migrate(){
  if (!MENU_DATA.length) { log('⚠️ MENU_DATA está vacío. Todavía no se cargó el menú en este archivo.'); return; }
  log('Migrando ' + MENU_DATA.length + ' productos...');
  for (const item of MENU_DATA) {
    try {
      await db.collection('products').add(item);
      log('✓ ' + item.name);
    } catch (e) {
      log('✗ ' + item.name + ' — ' + e.message);
    }
  }
  log('\n¡Listo! Abrí index.html para ver el menú.');
}
